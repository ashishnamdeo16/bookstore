name: CI - build and deploy services

# Runs when you push to main and files under a watched service folder changed.
on:
  push:
    branches: [main]
    paths:
      - "book-service/**"      # (start with one service; add more paths later)

# Needed for OIDC: 'id-token: write' lets the job get a token AWS will trust.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 016257615899.dkr.ecr.us-west-2.amazonaws.com
  ROLE_ARN: arn:aws:iam::016257615899:role/github-actions-ecr-push
  INFRA_REPO: ashishnamdeo16/bookstore-infra

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # For now just book-service. To add more, add entries here AND add their
        # folders to the 'paths:' filter above.
        service:
          - name: book-service
             manifest: k8s/book-service.yaml
    steps:
      - name: Checkout code repo
        uses: actions/checkout@v4

      # Only proceed if THIS service's folder actually changed in the push.
      - name: Check if service changed
        id: changed
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^${{ matrix.service.name }}/"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.changed.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: steps.changed.outputs.changed == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (amd64)
        if: steps.changed.outputs.changed == 'true'
        run: |
          TAG="${GITHUB_SHA::7}"
          # Handle the capital-F Dockerfile some services use.
          DOCKERFILE="${{ matrix.service.name }}/Dockerfile"
          [ -f "$DOCKERFILE" ] || DOCKERFILE="${{ matrix.service.name }}/DockerFile"
          docker buildx build --platform linux/amd64 \
            -f "$DOCKERFILE" \
            -t "$ECR_REGISTRY/${{ matrix.service.name }}:$TAG" \
            --push "${{ matrix.service.name }}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Update image tag in infra repo
        if: steps.changed.outputs.changed == 'true'
        run: |
          git clone "https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/${INFRA_REPO}.git" infra
          cd infra
          # Replace the image tag for this service in its manifest.
          sed -i -E "s|(${{ matrix.service.name }}):[^\"[:space:]]+|\1:${IMAGE_TAG}|g" "${{ matrix.service.manifest }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.service.manifest }}"
          git commit -m "ci: ${{ matrix.service.name }} -> ${IMAGE_TAG}" || echo "no changes"
          git push
