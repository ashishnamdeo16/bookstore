server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/bookstore_analytics_db?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

jwt:
  secret: ${JWT_SECRET:3b796f1d-02e9-4263-a411-ceb6e5532239}

logging:
  level:
    com.bookstore.analytics: INFO
