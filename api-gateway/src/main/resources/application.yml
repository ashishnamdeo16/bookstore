server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                # Patterns (not exact origins) so production frontends on ELB/HTTPS/custom domains work.
                # Override with CORS_ALLOWED_ORIGIN_PATTERNS (comma-separated), e.g. https://app.example.com,http://localhost:5173
                allowedOriginPatterns:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                  - "http://*.elb.amazonaws.com"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                # JWT is sent via Authorization header, not cookies — credentials mode is not required.
                allowCredentials: true
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/user/**

            - id: book-service
              uri: ${BOOK_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/books/**,/api/authors/**,/api/categories/**,/api/publishers/**

            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/api/payments/**

            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/analytics/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
