server:
  port: 8085

spring:
  profiles:
    active: dev

  application:
    name: notification-service

jwt:
  secret: 3b796f1d-02e9-4263-a411-ceb6e5532239
  expiration: 900000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
