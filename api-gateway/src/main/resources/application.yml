server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/user/**

            - id: book-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/books/**,/api/authors/**,/api/categories/**,/api/publishers/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/orders/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
