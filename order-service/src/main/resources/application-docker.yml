server:
  port: ${SERVER_PORT:8084}

services:
  book-service:
    url: ${BOOK_SERVICE_URL:http://localhost:8083}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/bookstore_order_db?serverTimezone=UTC
    username: ${DB_USERNAME:ashish}
    password: ${DB_PASSWORD:Ashish$1}
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:3b796f1d-02e9-4263-a411-ceb6e5532239}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
