server:
  port: 8084

services:
  book-service:
    url: http://localhost:8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore_order_db?serverTimezone=UTC
    username: ashish
    password: Ashish$1
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3


  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

jwt:
  secret: 3b796f1d-02e9-4263-a411-ceb6e5532239

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,beans


logging:
  level:
    org.springframework.web: DEBUG

