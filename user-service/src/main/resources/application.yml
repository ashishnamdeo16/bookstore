server:
  port: 8082

spring:
  application:
    name: user-service
  profiles:
    active: dev

  jwt:
    secret: some-long-random-string
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
