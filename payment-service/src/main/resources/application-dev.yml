server:
  port: 8087

spring:

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: jdbc:mysql://localhost:3306/bookstore_payment_db?serverTimezone=UTC
    username: ${DB_USERNAME:ashish}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.web: DEBUG

stripe:
  # Set via env: stripe listen --forward-to localhost:8087/api/payments/webhook
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  secret-key: ${STRIPE_SECRET_KEY:}