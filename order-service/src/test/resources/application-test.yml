spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

jwt:
  secret: 3b796f1d-02e9-4263-a411-ceb6e5532239
  expiration: 900000

services:
  book-service:
    url: http://localhost:8083
  user-service:
    url: http://localhost:8082

management:
  health:
    kafka:
      enabled: false

logging:
  level:
    root: warn
    com.bookstore.order: info
