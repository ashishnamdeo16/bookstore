server:
  port: ${SERVER_PORT:8082}

app:
  internal-api-key: ${INTERNAL_API_KEY:bookstore-dev-internal-key}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/bookstore_user_db?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:3b796f1d-02e9-4263-a411-ceb6e5532239}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.web: INFO
